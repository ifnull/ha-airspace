# Example Home Assistant dashboard for Airspace (ha-airspace, v0.2.30+).
#
# A "sections" view (Nearest Traffic / Overview / Alerts). Use a STORAGE-mode
# dashboard so you can drag cards: Settings → Dashboards → Add dashboard, then
# Edit → ⋮ → Raw configuration editor and paste the `views:` block below.
#
# REPLACE these to match YOURS:
#   - sensor.airspace_flag_<flag>          -> your enrichment.flags names
#   - *_receiver_rx_1090_* / *_rx_978_*    -> your receiver names (slugified)
#   - *_remote_id_dump3411_*               -> your Remote ID feed name
#   - binary_sensor.airspace_alert_<rule>  -> your alert rule names
#   - the two shortcut card URLs           -> your receiver / drone-host URLs
#
# Notes:
#   - Tile / marker popups need the HACS `browser_mod` add-on. Without it the
#     tiles still show counts; tap just opens the default more-info.
#   - REQUIRED for the map to show anything but your home zone: sensor.airspace
#     _aircraft_map / _drone_map / _drone_operator_map are NOT created by
#     ha-airspace or MQTT discovery — they're plain HA template sensors you add
#     yourself. See the "configuration.yaml" block at the very bottom of this
#     file, paste it into your actual configuration.yaml (not the dashboard
#     editor), and restart HA. Skipping this is the #1 reason people report an
#     empty map.
#   - Flight/hex link to globe.adsbexchange.com; flags render as country emoji.

title: Airspace
views:
  - title: Airspace
    type: sections
    max_columns: 5
    icon: mdi:radar
    dense_section_placement: true
    header:
      card:
        type: markdown
        content: "# Airspace"
        text_only: true
    sections:
      # ===================================================================
      # Nearest Traffic
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Nearest Traffic
            heading_style: title
            icon: mdi:near-me
          # Map: nearest aircraft + drone (+ operator), plus the nearest
          # MILITARY / INTERESTING aircraft as their own markers — the flag
          # sensors now carry the nearest match's lat/lon. zone.home for ref.
          # sensor.airspace_drone_operator is a template sensor (see bottom).
          - type: map
            default_zoom: 9
            theme_mode: auto
            grid_options: { columns: full, rows: 5 }
            # `label_mode: icon` renders each entity's mdi icon as the marker:
            # ✈️/🚁 by type (aircraft template sensor), game controller (drone),
            # operator pin, and the alert icon for flagged aircraft. The aircraft
            # & drone markers are template sensors (see the config block at the
            # bottom); the flag sensors are plotted directly.
            entities:
              - entity: sensor.airspace_aircraft_map
                label_mode: icon
              - entity: sensor.airspace_drone_map
                label_mode: icon
              - entity: sensor.airspace_drone_operator
                label_mode: icon
              - entity: sensor.airspace_flag_military
                label_mode: icon
              - entity: sensor.airspace_flag_interesting
                label_mode: icon
              - entity: zone.home
          # Nearest aircraft detail (rich — heading, bullets, photo).
          - type: markdown
            content: |
              {% set s = 'sensor.airspace_nearest_aircraft' -%}
              {% if states(s) in ['unknown', 'unavailable'] -%}
              No aircraft in range.
              {% else -%}
              {% set db = state_attr(s,'db_metadata') or {} -%}
              {% set brg = (state_attr(s,'bearing_to') or {}).get('home') -%}
              {% set cpa = state_attr(s,'predicted_closest_approach_nm') -%}
              {% set gs = state_attr(s,'ground_speed_kt') -%}
              ## {{ (state_attr(s,'country_flag') ~ ' ') if state_attr(s,'country_flag') else '' }}{{ '[' ~ (state_attr(s,'flight') or state_attr(s,'hex')) ~ '](https://globe.adsbexchange.com/?icao=' ~ state_attr(s,'hex') ~ ')' if state_attr(s,'hex') else (state_attr(s,'flight') or '?') }}
              **{{ db.get('model') or state_attr(s,'aircraft_type') or 'unknown type' }}**{{ ' · ' ~ db.get('ownop') if db.get('ownop') }}

              - **Distance:** {{ '%.1f'|format(states(s)|float) }} nm{{ ' · brg ' ~ brg|round(0)|int ~ '°' if brg is not none }}
              - **Altitude:** {{ state_attr(s,'alt_baro_ft') or '—' }} ft
              - **Speed:** {{ gs|round(0)|int if gs is not none else '—' }} kt
              - **Squawk:** {{ state_attr(s,'squawk') or '—' }}
              - **Closest approach:** {{ (cpa|round(1)|string ~ ' nm') if cpa is not none else '—' }}
              - **Flags:** {{ state_attr(s,'flags')|join(', ') if state_attr(s,'flags') else '—' }}
              - **Registration:** {{ state_attr(s,'registration') or '—' }}
              {% set p = state_attr(s,'photo') -%}
              {% if p %}
              ![photo]({{ p.thumbnail_url }})

              {{ ('_© ' ~ p.photographer ~ '_') if p.photographer else '' }}
              {% endif -%}
              {% endif -%}

      # ===================================================================
      # Overview — icon grid (counts + nearest), tap a tile for a popup
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Overview
            heading_style: title
            icon: mdi:space-station
          - type: glance
            state_color: true
            entities:
              - entity: sensor.airspace_aircraft_count
                name: Aircraft
              - entity: sensor.airspace_drone_count
                name: Drones
                icon: mdi:quadcopter
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Nearest drone
                      content:
                        type: markdown
                        content: |
                          {% set s = 'sensor.airspace_nearest_drone' -%}
                          {% if states(s) in ['unknown','unavailable'] -%}
                          No drones in range.
                          {% else -%}
                          {% set db = state_attr(s,'db_metadata') or {} -%}
                          {% set brg = (state_attr(s,'bearing_to') or {}).get('home') -%}
                          {% set agl = state_attr(s,'agl_ft') -%}
                          ## {{ state_attr(s,'operator_id') or state_attr(s,'track_id') }}
                          **{{ (db.get('make') ~ ' ' ~ db.get('model')) if db.get('make') else (state_attr(s,'ua_type') or 'drone') }}**

                          - **Distance:** {{ '%.1f'|format(states(s)|float) }} nm{{ ' · brg ' ~ brg|round(0)|int ~ '°' if brg is not none }}
                          - **Height (AGL):** {{ agl|round(0)|int if agl is not none else '—' }} ft
                          - **ID type:** {{ state_attr(s,'id_type') or '—' }}
                          {% set loc_type = state_attr(s,'operator_location_type') -%}
                          - **Operator:** {{ 'takeoff point (not live)' if loc_type == 'takeoff' else 'located' if state_attr(s,'operator_lat') is not none else 'not broadcast' }}
                          - **FAA status:** {{ db.get('status') or '—' }}
                          {% endif -%}
              - entity: sensor.airspace_nearest_aircraft
                name: Nearest
                icon: mdi:airplane-marker
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Nearest aircraft
                      content:
                        type: markdown
                        content: |
                          {% set s = 'sensor.airspace_nearest_aircraft' -%}
                          {% if states(s) in ['unknown','unavailable'] -%}
                          No aircraft in range.
                          {% else -%}
                          {% set db = state_attr(s,'db_metadata') or {} -%}
                          {% set brg = (state_attr(s,'bearing_to') or {}).get('home') -%}
                          {% set cpa = state_attr(s,'predicted_closest_approach_nm') -%}
                          {% set gs = state_attr(s,'ground_speed_kt') -%}
                          ## {{ (state_attr(s,'country_flag') ~ ' ') if state_attr(s,'country_flag') else '' }}{{ '[' ~ (state_attr(s,'flight') or state_attr(s,'hex')) ~ '](https://globe.adsbexchange.com/?icao=' ~ state_attr(s,'hex') ~ ')' if state_attr(s,'hex') else (state_attr(s,'flight') or '?') }}
                          **{{ db.get('model') or state_attr(s,'aircraft_type') or 'unknown type' }}**{{ ' · ' ~ db.get('ownop') if db.get('ownop') }}

                          - **Distance:** {{ '%.1f'|format(states(s)|float) }} nm{{ ' · brg ' ~ brg|round(0)|int ~ '°' if brg is not none }}
                          - **Altitude:** {{ state_attr(s,'alt_baro_ft') or '—' }} ft
                          - **Speed:** {{ gs|round(0)|int if gs is not none else '—' }} kt
                          - **Squawk:** {{ state_attr(s,'squawk') or '—' }}
                          - **Closest approach:** {{ (cpa|round(1)|string ~ ' nm') if cpa is not none else '—' }}
                          - **Flags:** {{ state_attr(s,'flags')|join(', ') if state_attr(s,'flags') else '—' }}
                          - **Registration:** {{ state_attr(s,'registration') or '—' }}
                          {% set p = state_attr(s,'photo') -%}
                          {% if p %}
                          ![photo]({{ p.thumbnail_url }})

                          {{ ('_© ' ~ p.photographer ~ '_') if p.photographer else '' }}
                          {% endif -%}
                          {% endif -%}
              # Flag tiles — tap for a table of every matching aircraft.
              # Duplicate per flag: change the entity + name + the sensor id in
              # the template (3 places: rows, photo, and the heading title).
              - entity: sensor.airspace_flag_military
                name: Military
                icon: mdi:airplane-alert
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Flagged aircraft
                      content:
                        type: markdown
                        content: |
                          {% set s = 'sensor.airspace_flag_military' -%}
                          {% set rows = state_attr(s,'aircraft') or [] -%}
                          {% set p = state_attr(s,'photo') -%}
                          {% if rows -%}
                          {% if p %}![photo]({{ p.thumbnail_url }})

                          {{ ('_© ' ~ p.photographer ~ ' (nearest match)_') if p.photographer else '' }}

                          {% endif -%}
                          | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk | Notes |
                          |---|---|--:|--:|--:|--:|:--|
                          {% for a in rows -%}
                          | {{ (a.country_flag ~ ' ') if a.country_flag else '' }}{{ '[' ~ (a.flight or a.hex) ~ '](https://globe.adsbexchange.com/?icao=' ~ a.hex ~ ')' if a.hex else (a.flight or '—') }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} | {{ 'PIA' if a.db_metadata.get('pia') else ('LADD' if a.db_metadata.get('ladd') else ('mil' if a.db_metadata.get('mil') else (a.db_metadata.get('ownop') or '—'))) }} |
                          {% endfor -%}
                          {% else -%}
                          None right now.
                          {% endif -%}
              - entity: sensor.airspace_flag_interesting
                name: Interesting
                icon: mdi:airplane-alert
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Interesting aircraft
                      content:
                        type: markdown
                        content: |
                          {% set s = 'sensor.airspace_flag_interesting' -%}
                          {% set rows = state_attr(s,'aircraft') or [] -%}
                          {% set p = state_attr(s,'photo') -%}
                          {% if rows -%}
                          {% if p %}![photo]({{ p.thumbnail_url }})

                          {{ ('_© ' ~ p.photographer ~ ' (nearest match)_') if p.photographer else '' }}

                          {% endif -%}
                          | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk | Notes |
                          |---|---|--:|--:|--:|--:|:--|
                          {% for a in rows -%}
                          | {{ (a.country_flag ~ ' ') if a.country_flag else '' }}{{ '[' ~ (a.flight or a.hex) ~ '](https://globe.adsbexchange.com/?icao=' ~ a.hex ~ ')' if a.hex else (a.flight or '—') }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} | {{ 'PIA' if a.db_metadata.get('pia') else ('LADD' if a.db_metadata.get('ladd') else ('mil' if a.db_metadata.get('mil') else (a.db_metadata.get('ownop') or '—'))) }} |
                          {% endfor -%}
                          {% else -%}
                          None right now.
                          {% endif -%}
              - entity: sensor.airspace_flag_emergency
                name: Emergency
                icon: mdi:airplane-alert
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Emergency aircraft
                      content:
                        type: markdown
                        content: |
                          {% set s = 'sensor.airspace_flag_emergency' -%}
                          {% set rows = state_attr(s,'aircraft') or [] -%}
                          {% set p = state_attr(s,'photo') -%}
                          {% if rows -%}
                          {% if p %}![photo]({{ p.thumbnail_url }})

                          {{ ('_© ' ~ p.photographer ~ ' (nearest match)_') if p.photographer else '' }}

                          {% endif -%}
                          | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk | Notes |
                          |---|---|--:|--:|--:|--:|:--|
                          {% for a in rows -%}
                          | {{ (a.country_flag ~ ' ') if a.country_flag else '' }}{{ '[' ~ (a.flight or a.hex) ~ '](https://globe.adsbexchange.com/?icao=' ~ a.hex ~ ')' if a.hex else (a.flight or '—') }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} | {{ 'PIA' if a.db_metadata.get('pia') else ('LADD' if a.db_metadata.get('ladd') else ('mil' if a.db_metadata.get('mil') else (a.db_metadata.get('ownop') or '—'))) }} |
                          {% endfor -%}
                          {% else -%}
                          None right now.
                          {% endif -%}
          # Receiver + Remote-ID-feed health. REPLACE the names with yours.
          - type: entities
            title: Receivers & feeds
            entities:
              - entity: binary_sensor.airspace_receiver_rx_1090_status
                name: 1090 receiver
              - entity: sensor.airspace_receiver_rx_1090_aircraft_count
                name: 1090 aircraft
              - entity: sensor.airspace_receiver_rx_1090_message_rate
                name: 1090 msg/s
              - entity: binary_sensor.airspace_receiver_rx_978_status
                name: 978 receiver
              - entity: sensor.airspace_receiver_rx_978_aircraft_count
                name: 978 aircraft
              - entity: sensor.airspace_receiver_rx_978_message_rate
                name: 978 msg/s
              - entity: binary_sensor.airspace_remote_id_dump3411_status
                name: Remote ID feed
              - entity: sensor.airspace_remote_id_dump3411_drone_count
                name: Drones seen
              - entity: sensor.airspace_remote_id_dump3411_message_rate
                name: RID msg/s

      # ===================================================================
      # Alerts
      # ===================================================================
      - type: grid
        cards:
          - type: heading
            heading: Alerts
            heading_style: title
            icon: mdi:alert
          # Photo banner while an alert rule is active. Duplicate per rule —
          # change the binary_sensor in both the condition and the template.
          - type: conditional
            conditions:
              - entity: binary_sensor.airspace_alert_military_close
                state: "on"
            card:
              type: markdown
              content: |
                {% set a = 'binary_sensor.airspace_alert_military_close' -%}
                {% set d = (state_attr(a,'distance_to') or {}).get('home') -%}
                🚨 **{{ (state_attr(a,'country_flag') ~ ' ') if state_attr(a,'country_flag') else '' }}{{ '[' ~ (state_attr(a,'flight') or state_attr(a,'hex')) ~ '](https://globe.adsbexchange.com/?icao=' ~ state_attr(a,'hex') ~ ')' if state_attr(a,'hex') else (state_attr(a,'flight') or '?') }}**{{ ' · ' ~ '%.1f'|format(d) ~ ' nm' if d is not none }}
                {% set p = state_attr(a,'entity_picture') -%}
                {% if p %}
                ![photo]({{ p }})

                {{ ('_© ' ~ state_attr(a,'photographer') ~ '_') if state_attr(a,'photographer') else '' }}
                {% endif -%}
          # Always-visible flag tables (same content as the Overview popups).
          - type: markdown
            title: Emergency aircraft
            content: |
              {% set s = 'sensor.airspace_flag_emergency' -%}
              {% set rows = state_attr(s,'aircraft') or [] -%}
              {% if rows -%}
              | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk | Notes |
              |---|---|--:|--:|--:|--:|:--|
              {% for a in rows -%}
              | {{ (a.country_flag ~ ' ') if a.country_flag else '' }}{{ '[' ~ (a.flight or a.hex) ~ '](https://globe.adsbexchange.com/?icao=' ~ a.hex ~ ')' if a.hex else (a.flight or '—') }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} | {{ 'PIA' if a.db_metadata.get('pia') else ('LADD' if a.db_metadata.get('ladd') else ('mil' if a.db_metadata.get('mil') else (a.db_metadata.get('ownop') or '—'))) }} |
              {% endfor -%}
              {% else -%}
              None right now.
              {% endif -%}
          - type: markdown
            title: Military aircraft
            content: |
              {% set s = 'sensor.airspace_flag_military' -%}
              {% set rows = state_attr(s,'aircraft') or [] -%}
              {% if rows -%}
              | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk | Notes |
              |---|---|--:|--:|--:|--:|:--|
              {% for a in rows -%}
              | {{ (a.country_flag ~ ' ') if a.country_flag else '' }}{{ '[' ~ (a.flight or a.hex) ~ '](https://globe.adsbexchange.com/?icao=' ~ a.hex ~ ')' if a.hex else (a.flight or '—') }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} | {{ 'PIA' if a.db_metadata.get('pia') else ('LADD' if a.db_metadata.get('ladd') else ('mil' if a.db_metadata.get('mil') else (a.db_metadata.get('ownop') or '—'))) }} |
              {% endfor -%}
              {% else -%}
              None right now.
              {% endif -%}
          - type: markdown
            title: Interesting aircraft
            content: |
              {% set s = 'sensor.airspace_flag_interesting' -%}
              {% set rows = state_attr(s,'aircraft') or [] -%}
              {% if rows -%}
              | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk | Notes |
              |---|---|--:|--:|--:|--:|:--|
              {% for a in rows -%}
              | {{ (a.country_flag ~ ' ') if a.country_flag else '' }}{{ '[' ~ (a.flight or a.hex) ~ '](https://globe.adsbexchange.com/?icao=' ~ a.hex ~ ')' if a.hex else (a.flight or '—') }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} | {{ 'PIA' if a.db_metadata.get('pia') else ('LADD' if a.db_metadata.get('ladd') else ('mil' if a.db_metadata.get('mil') else (a.db_metadata.get('ownop') or '—'))) }} |
              {% endfor -%}
              {% else -%}
              None right now.
              {% endif -%}
          # Suspected spoofed drones (requires enable_spoof_detection). The
          # spoof_suspect flag is behavioral: a malformed/placeholder serial, or
          # one self_id broadcast across several serials. Make/Model is the FAA
          # lookup (blank for a bogus serial like 0x00 — itself a tell).
          - type: markdown
            title: Suspected spoofed drones
            content: |
              {% set s = 'sensor.airspace_flag_spoof_suspect' -%}
              {% set rows = state_attr(s,'aircraft') or [] -%}
              {% if rows -%}
              | UAS ID | Make / Model | Dist (nm) | Brg |
              |---|---|--:|--:|
              {% for a in rows -%}
              | `{{ a.track_id }}` | {{ (a.db_metadata.get('make') ~ ' ' ~ a.db_metadata.get('model')) if a.db_metadata.get('make') else '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} |
              {% endfor -%}
              {% else -%}
              None right now.
              {% endif -%}
          # Quick links to your receiver + drone web UIs. REPLACE the URLs.
          - type: shortcut
            label: Flight Map (1090/978)
            icon: mdi:airplane
            grid_options: { columns: full }
            tap_action: { action: url, url_path: "http://piaware.local:8080/" }
          - type: shortcut
            label: Drone Dashboard
            icon: mdi:quadcopter
            grid_options: { columns: full }
            tap_action: { action: url, url_path: "http://dump3411.local:8754/" }

# ---------------------------------------------------------------------------
# configuration.yaml — template sensors the map above plots. They mirror the
# nearest aircraft/drone position and set an `icon`, which the Map card renders
# via `label_mode: icon`. Static names = stable entity_ids (sensor.airspace_*_map).
# Add to configuration.yaml and restart HA.
#
# template:
#   - sensor:
#       # Aircraft: ✈️ by default, 🚁 for rotorcraft (emitter category A7).
#       # NOTE on `availability`: a Map marker only disappears when its entity
#       # goes `unavailable`. The source sensors clear (go unavailable) once the
#       # service purges a track, so each template sensor MUST gate availability
#       # on its source having a live position — otherwise the marker lingers on
#       # the map at its last coordinates after the aircraft/drone is gone.
#       - name: Airspace Aircraft Map
#         unique_id: airspace_aircraft_map
#         state: "{{ states('sensor.airspace_nearest_aircraft') }}"
#         availability: >-
#           {{ states('sensor.airspace_nearest_aircraft') not in ['unknown','unavailable']
#              and state_attr('sensor.airspace_nearest_aircraft','latitude') is not none }}
#         icon: >-
#           {{ 'mdi:helicopter' if state_attr('sensor.airspace_nearest_aircraft','category') == 'A7' else 'mdi:airplane' }}
#         attributes:
#           latitude: "{{ state_attr('sensor.airspace_nearest_aircraft','latitude') }}"
#           longitude: "{{ state_attr('sensor.airspace_nearest_aircraft','longitude') }}"
#       # Drone: game-controller icon.
#       - name: Airspace Drone Map
#         unique_id: airspace_drone_map
#         state: "{{ states('sensor.airspace_nearest_drone') }}"
#         availability: >-
#           {{ states('sensor.airspace_nearest_drone') not in ['unknown','unavailable']
#              and state_attr('sensor.airspace_nearest_drone','latitude') is not none }}
#         icon: mdi:controller-classic
#         attributes:
#           latitude: "{{ state_attr('sensor.airspace_nearest_drone','latitude') }}"
#           longitude: "{{ state_attr('sensor.airspace_nearest_drone','longitude') }}"
#       # Drone OPERATOR location (the security-relevant marker). Available only
#       # when the nearest drone is live AND broadcast an operator position —
#       # otherwise this pin would persist at stale coordinates (the operator_id
#       # `or 'operator'` fallback keeps the sensor from going unavailable on its
#       # own, so the availability gate is what clears the marker).
#       #
#       # CAUTION: operator_lat/lon is not always a live operator fix — some
#       # transmitters report the drone's own TAKEOFF point under the same
#       # field (dump3411 FEED.md `operator.location_type`). The icon below
#       # flags that case (mdi:map-marker-radius) instead of pinning it as
#       # mdi:account-alert like a genuine live operator position — don't drop
#       # this check, or a takeoff-point reading reads as "operator is here."
#       - name: Airspace Drone Operator
#         unique_id: airspace_drone_operator_map
#         state: "{{ state_attr('sensor.airspace_nearest_drone','operator_id') or 'operator' }}"
#         availability: >-
#           {{ states('sensor.airspace_nearest_drone') not in ['unknown','unavailable']
#              and state_attr('sensor.airspace_nearest_drone','operator_lat') is not none }}
#         icon: >-
