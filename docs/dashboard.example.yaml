# Example Home Assistant dashboard for ha-airspace (v0.2.7+).
#
# Built entirely from the entities the service publishes via MQTT discovery — no
# custom card. Two ways to use it:
#   - whole view: dashboard -> Edit -> Raw configuration editor, add the `- title:
#     Airspace ...` block under your `views:`.
#   - one card at a time: Edit -> Add Card -> Manual, paste a single card object.
#
# As of v0.2.7 the nearest sensors expose `latitude`/`longitude` attributes, so
# the Map card works with NO template sensors. (Only the optional drone-OPERATOR
# marker still needs one tiny template — see the note at the bottom.)
#
# Replace ids to match YOURS:
#   - binary_sensor.airspace_alert_<rule>   -> your alert rule names
#   - *_receiver_<name>_*                    -> your receiver names
#     (HA slugifies "home-1090" -> "home_1090")

title: Airspace
views:
  - title: Airspace
    path: airspace
    cards:
      # Map: nearest aircraft + nearest drone, around home. No template sensors —
      # the nearest sensors carry latitude/longitude attributes directly.
      - type: map
        title: Nearest traffic
        default_zoom: 9
        entities:
          - entity: sensor.airspace_nearest_aircraft
          - entity: sensor.airspace_nearest_drone
          - entity: zone.home

      # At-a-glance counts.
      - type: glance
        title: Overview
        entities:
          - entity: sensor.airspace_aircraft_count
            name: Aircraft
          - entity: sensor.airspace_drone_count
            name: Drones
          - entity: sensor.airspace_nearest_aircraft
            name: Nearest (nm)

      # Nearest aircraft detail, templated from the sensor's attributes
      # (the full payload rides as attributes via json_attributes_topic).
      - type: markdown
        title: Nearest aircraft
        content: >
          {% set s = 'sensor.airspace_nearest_aircraft' %}
          {% if states(s) not in ['unknown', 'unavailable'] %}
          {% set db = state_attr(s, 'db_metadata') or {} %}
          {% set brg = (state_attr(s, 'bearing_to') or {}).get('home') %}
          {% set cpa = state_attr(s, 'predicted_closest_approach_nm') %}
          **{{ state_attr(s, 'flight') or state_attr(s, 'hex') }}**
          {{ db.get('model') or state_attr(s, 'aircraft_type') or '' }}
          {{ ' · ' ~ db.get('ownop') if db.get('ownop') else '' }}

          {{ states(s) }} nm{{ ', brg ' ~ brg | round(0) ~ '°' if brg is not none else '' }}
          · {{ state_attr(s, 'alt_baro_ft') or '?' }} ft
          {% if cpa is not none %} · CPA {{ cpa | round(1) }} nm{% endif %}
          {% if state_attr(s, 'flags') %} · **{{ state_attr(s, 'flags') | join(', ') }}**{% endif %}
          {% else %}
          No aircraft in range.
          {% endif %}

      # Alert card with the Planespotters photo. Shows only while the rule is
      # active; entity_picture + flight come from the alert's info attributes.
      # One conditional card per rule — replace the rule name.
      - type: conditional
        conditions:
          - entity: binary_sensor.airspace_alert_military_close
            state: "on"
        card:
          type: markdown
          content: >
            {% set a = 'binary_sensor.airspace_alert_military_close' %}
            🚨 **{{ state_attr(a, 'flight') or state_attr(a, 'hex') }}**
            {% set d = (state_attr(a, 'distance_to') or {}).get('home') %}
            {{ '· ' ~ d | round(1) ~ ' nm' if d is not none else '' }}
            {% set p = state_attr(a, 'entity_picture') %}
            {% if p %}

            ![photo]({{ p }})

            {{ '_© ' ~ state_attr(a, 'photographer') ~ '_' if state_attr(a, 'photographer') else '' }}
            {% endif %}

      # Receiver health. Rename to match your receivers (home-1090 -> home_1090).
      - type: entities
        title: Receivers
        entities:
          - entity: binary_sensor.airspace_receiver_home_1090_status
            name: 1090 receiver
          - entity: sensor.airspace_receiver_home_1090_aircraft_count
            name: Aircraft seen
          - entity: sensor.airspace_receiver_home_1090_message_rate
            name: Messages/sec

# ---------------------------------------------------------------------------
# Optional: drone OPERATOR on the map.
#
# The nearest-drone sensor already maps the drone itself. The operator's
# location (operator_lat / operator_lon attributes) needs one tiny template
# sensor in configuration.yaml to expose it as latitude/longitude:
#
# template:
#   - sensor:
#       - name: Airspace Drone Operator
#         unique_id: airspace_drone_operator_map
#         state: "{{ state_attr('sensor.airspace_nearest_drone', 'operator_id') or 'operator' }}"
#         attributes:
#           latitude: "{{ state_attr('sensor.airspace_nearest_drone', 'operator_lat') }}"
#           longitude: "{{ state_attr('sensor.airspace_nearest_drone', 'operator_lon') }}"
#           icon: mdi:account-alert
#
# Then add `- entity: sensor.airspace_drone_operator` to the Map card entities.
# ---------------------------------------------------------------------------
