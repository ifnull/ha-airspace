# Example Home Assistant dashboard for ha-airspace (v0.2.11+).
#
# Built entirely from the entities the service publishes via MQTT discovery —
# every card here is stock except the clearly-marked OPTIONAL "tap for details"
# card near the top, which needs the HACS `browser_mod` add-on (delete it if you
# don't use browser_mod). Two ways to use it:
#   - whole view: dashboard -> Edit -> Raw configuration editor, add the `- title:
#     Airspace ...` block under your `views:`.
#   - one card at a time: Edit -> Add Card -> Manual, paste a single card object.
#
# As of v0.2.7 the nearest sensors expose `latitude`/`longitude` attributes, so
# the Map card works with NO template sensors. (Only the optional drone-OPERATOR
# marker still needs one tiny template — see the note at the bottom.)
#
# As of v0.2.11 each configured flag gets a sensor.airspace_flag_<flag> whose
# state is the count and whose `aircraft` attribute is a distance-sorted list
# (alt / distance / type / squawk / flags). The "Watched aircraft" cards below
# render those as tables — replace the flag names with YOURS from enrichment.flags.
#
# Replace ids to match YOURS:
#   - sensor.airspace_flag_<flag>           -> your enrichment.flags names
#   - binary_sensor.airspace_alert_<rule>   -> your alert rule names
#   - *_receiver_<name>_*                    -> your receiver names
#     (HA slugifies "home-1090" -> "home_1090")

title: Airspace
views:
  - title: Airspace
    path: airspace
    cards:
      # Map: nearest aircraft + nearest drone, around home. No template sensors —
      # the nearest sensors carry latitude/longitude attributes directly.
      - type: map
        title: Nearest traffic
        default_zoom: 9
        entities:
          - entity: sensor.airspace_nearest_aircraft
          - entity: sensor.airspace_nearest_drone
          - entity: zone.home

      # OPTIONAL — "tap for details" (requires the HACS `browser_mod` add-on).
      # The Map card above can't fire tap actions, so this list is the tappable
      # surface beside it: tap a row to open a popup. Nearest aircraft/drone show
      # a detail card; the flag rows show a table of all matching aircraft. Delete
      # this whole card if you don't use browser_mod — everything else is stock.
      # Note: photos ride ALERT payloads only, so they're not in these popups; for
      # a photo popup, put one on a binary_sensor.airspace_alert_<rule> entity.
      - type: entities
        title: Airspace — tap for details
        state_color: true
        entities:
          - entity: sensor.airspace_nearest_aircraft
            name: Nearest aircraft
            icon: mdi:airplane-marker
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Nearest aircraft
                  content:
                    type: markdown
                    content: |
                      {% set s = 'sensor.airspace_nearest_aircraft' -%}
                      {% if states(s) in ['unknown','unavailable'] -%}
                      No aircraft in range.
                      {% else -%}
                      {% set db = state_attr(s,'db_metadata') or {} -%}
                      {% set brg = (state_attr(s,'bearing_to') or {}).get('home') -%}
                      {% set cpa = state_attr(s,'predicted_closest_approach_nm') -%}
                      {% set gs = state_attr(s,'ground_speed_kt') -%}
                      ## {{ state_attr(s,'flight') or state_attr(s,'hex') }}
                      **{{ db.get('model') or state_attr(s,'aircraft_type') or 'unknown type' }}**{{ ' · ' ~ db.get('ownop') if db.get('ownop') }}

                      - **Distance:** {{ states(s) }} nm{{ ' · brg ' ~ brg|round(0)|int ~ '°' if brg is not none }}
                      - **Altitude:** {{ state_attr(s,'alt_baro_ft') or '—' }} ft
                      - **Speed:** {{ gs|round(0)|int if gs is not none else '—' }} kt
                      - **Squawk:** {{ state_attr(s,'squawk') or '—' }}
                      - **Closest approach:** {{ (cpa|round(1)|string ~ ' nm') if cpa is not none else '—' }}
                      - **Flags:** {{ state_attr(s,'flags')|join(', ') if state_attr(s,'flags') else '—' }}
                      - **Registration:** {{ state_attr(s,'registration') or '—' }}
                      {% set p = state_attr(s,'photo') -%}
                      {% if p %}
                      ![photo]({{ p.thumbnail_url }})

                      {{ ('_© ' ~ p.photographer ~ '_') if p.photographer else '' }}
                      {% endif -%}
                      {% endif -%}
          - entity: sensor.airspace_nearest_drone
            name: Nearest drone
            icon: mdi:quadcopter
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Nearest drone
                  content:
                    type: markdown
                    content: |
                      {% set s = 'sensor.airspace_nearest_drone' -%}
                      {% if states(s) in ['unknown','unavailable'] -%}
                      No drones in range.
                      {% else -%}
                      {% set db = state_attr(s,'db_metadata') or {} -%}
                      {% set brg = (state_attr(s,'bearing_to') or {}).get('home') -%}
                      {% set agl = state_attr(s,'agl_ft') -%}
                      ## {{ state_attr(s,'operator_id') or state_attr(s,'track_id') }}
                      **{{ (db.get('make') ~ ' ' ~ db.get('model')) if db.get('make') else (state_attr(s,'ua_type') or 'drone') }}**

                      - **Distance:** {{ states(s) }} nm{{ ' · brg ' ~ brg|round(0)|int ~ '°' if brg is not none }}
                      - **Height (AGL):** {{ agl|round(0)|int if agl is not none else '—' }} ft
                      - **ID type:** {{ state_attr(s,'id_type') or '—' }}
                      - **Operator:** {{ 'located' if state_attr(s,'operator_lat') is not none else 'not broadcast' }}
                      - **FAA status:** {{ db.get('status') or '—' }}
                      {% endif -%}
          # Flag rows — tap to see every matching aircraft. Duplicate per flag,
          # changing the entity, the name, and the sensor id inside the template.
          - entity: sensor.airspace_flag_military
            name: Military
            icon: mdi:airplane-alert
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Military aircraft
                  content:
                    type: markdown
                    content: |
                      {% set rows = state_attr('sensor.airspace_flag_military','aircraft') or [] -%}
                      {% set p = state_attr('sensor.airspace_flag_military','photo') -%}
                      {% if rows -%}
                      {% if p %}![photo]({{ p.thumbnail_url }})

                      {{ ('_© ' ~ p.photographer ~ ' (nearest match)_') if p.photographer else '' }}

                      {% endif -%}
                      | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk |
                      |---|---|--:|--:|--:|--:|
                      {% for a in rows -%}
                      | {{ a.flight or a.hex }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} |
                      {% endfor -%}
                      {% else -%}
                      None right now.
                      {% endif -%}
          - entity: sensor.airspace_flag_interesting
            name: Interesting
            icon: mdi:airplane-alert
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Interesting aircraft
                  content:
                    type: markdown
                    content: |
                      {% set rows = state_attr('sensor.airspace_flag_interesting','aircraft') or [] -%}
                      {% set p = state_attr('sensor.airspace_flag_interesting','photo') -%}
                      {% if rows -%}
                      {% if p %}![photo]({{ p.thumbnail_url }})

                      {{ ('_© ' ~ p.photographer ~ ' (nearest match)_') if p.photographer else '' }}

                      {% endif -%}
                      | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk |
                      |---|---|--:|--:|--:|--:|
                      {% for a in rows -%}
                      | {{ a.flight or a.hex }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} |
                      {% endfor -%}
                      {% else -%}
                      None right now.
                      {% endif -%}
          - entity: sensor.airspace_flag_emergency
            name: Emergency
            icon: mdi:airplane-alert
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Emergency aircraft
                  content:
                    type: markdown
                    content: |
                      {% set rows = state_attr('sensor.airspace_flag_emergency','aircraft') or [] -%}
                      {% set p = state_attr('sensor.airspace_flag_emergency','photo') -%}
                      {% if rows -%}
                      {% if p %}![photo]({{ p.thumbnail_url }})

                      {{ ('_© ' ~ p.photographer ~ ' (nearest match)_') if p.photographer else '' }}

                      {% endif -%}
                      | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk |
                      |---|---|--:|--:|--:|--:|
                      {% for a in rows -%}
                      | {{ a.flight or a.hex }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} |
                      {% endfor -%}
                      {% else -%}
                      None right now.
                      {% endif -%}

      # At-a-glance counts. The flag sensors (state = count) sit alongside the
      # totals; tap one to open the matching aircraft list in its attributes.
      - type: glance
        title: Overview
        entities:
          - entity: sensor.airspace_aircraft_count
            name: Aircraft
          - entity: sensor.airspace_drone_count
            name: Drones
          - entity: sensor.airspace_nearest_aircraft
            name: Nearest (nm)
          # These must match flags you actually configured (enrichment.flags).
          # The add-on toggles produce: military, interesting, emergency.
          - entity: sensor.airspace_flag_military
            name: Military
          - entity: sensor.airspace_flag_interesting
            name: Interesting
          - entity: sensor.airspace_flag_emergency
            name: Emergency

      # Nearest aircraft detail, templated from the sensor's attributes
      # (the full payload rides as attributes via json_attributes_topic).
      # Shows the same fields the map popup can't: altitude, distance, bearing,
      # type, squawk, flags, and the predictive closest-approach.
      - type: markdown
        title: Nearest aircraft
        content: >
          {% set s = 'sensor.airspace_nearest_aircraft' %}
          {% if states(s) not in ['unknown', 'unavailable'] %}
          {% set db = state_attr(s, 'db_metadata') or {} %}
          {% set brg = (state_attr(s, 'bearing_to') or {}).get('home') %}
          {% set cpa = state_attr(s, 'predicted_closest_approach_nm') %}
          {% set sq = state_attr(s, 'squawk') %}
          **{{ state_attr(s, 'flight') or state_attr(s, 'hex') }}**
          {{ db.get('model') or state_attr(s, 'aircraft_type') or '' }}
          {{ ' · ' ~ db.get('ownop') if db.get('ownop') else '' }}

          {{ states(s) }} nm{{ ', brg ' ~ brg | round(0) ~ '°' if brg is not none else '' }}
          · {{ state_attr(s, 'alt_baro_ft') or '?' }} ft
          {% if sq %} · squawk {{ sq }}{% endif %}
          {% if cpa is not none %} · CPA {{ cpa | round(1) }} nm{% endif %}
          {% if state_attr(s, 'flags') %} · **{{ state_attr(s, 'flags') | join(', ') }}**{% endif %}
          {% else %}
          No aircraft in range.
          {% endif %}

      # Watched aircraft — one table per flag. The state is the count; the
      # `aircraft` attribute is a distance-sorted list of matching aircraft, each
      # with the fields you asked to see everywhere: flight, type, alt, distance,
      # bearing, squawk. Duplicate this card per flag and change the entity + title.
      #
      # NOTE: the content uses a LITERAL block scalar (`content: |`), not folded
      # (`>`). A folded scalar collapses every table row onto one line, so the
      # markdown table renders as a single mushed row. Keep the `|` and the `-%}`
      # whitespace trims, and don't reindent the Jinja lines.
      - type: markdown
        title: Military aircraft
        content: |
          {% set s = 'sensor.airspace_flag_military' -%}
          {% set rows = state_attr(s, 'aircraft') or [] -%}
          {% if rows -%}
          | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk |
          |---|---|--:|--:|--:|--:|
          {% for a in rows -%}
          | {{ a.flight or a.hex }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} |
          {% endfor -%}
          {% else -%}
          None right now.
          {% endif -%}

      # Same card for the `interesting` flag — change the entity + title only.
      - type: markdown
        title: Interesting aircraft
        content: |
          {% set s = 'sensor.airspace_flag_interesting' -%}
          {% set rows = state_attr(s, 'aircraft') or [] -%}
          {% if rows -%}
          | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk |
          |---|---|--:|--:|--:|--:|
          {% for a in rows -%}
          | {{ a.flight or a.hex }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} |
          {% endfor -%}
          {% else -%}
          None right now.
          {% endif -%}

      # ...and the `emergency` flag (squawk 7500/7600/7700).
      - type: markdown
        title: Emergency aircraft
        content: |
          {% set s = 'sensor.airspace_flag_emergency' -%}
          {% set rows = state_attr(s, 'aircraft') or [] -%}
          {% if rows -%}
          | Flight | Type | Alt (ft) | Dist (nm) | Brg | Squawk |
          |---|---|--:|--:|--:|--:|
          {% for a in rows -%}
          | {{ a.flight or a.hex }} | {{ a.aircraft_type or '—' }} | {{ a.alt_baro_ft or '—' }} | {{ '%.1f'|format(a.distance_nm) if a.distance_nm is not none else '—' }} | {{ a.bearing_deg|round(0)|int if a.bearing_deg is not none else '—' }} | {{ a.squawk or '—' }} |
          {% endfor -%}
          {% else -%}
          None right now.
          {% endif -%}

      # Alert card with the Planespotters photo. Shows only while the rule is
      # active; entity_picture + flight come from the alert's info attributes.
      # One conditional card per rule — replace the rule name.
      - type: conditional
        conditions:
          - entity: binary_sensor.airspace_alert_military_close
            state: "on"
        card:
          type: markdown
          content: >
            {% set a = 'binary_sensor.airspace_alert_military_close' %}
            🚨 **{{ state_attr(a, 'flight') or state_attr(a, 'hex') }}**
            {% set d = (state_attr(a, 'distance_to') or {}).get('home') %}
            {{ '· ' ~ d | round(1) ~ ' nm' if d is not none else '' }}
            {% set p = state_attr(a, 'entity_picture') %}
            {% if p %}

            ![photo]({{ p }})

            {{ '_© ' ~ state_attr(a, 'photographer') ~ '_' if state_attr(a, 'photographer') else '' }}
            {% endif %}

      # Receiver health. !!! REPLACE the receiver name in every id below with
      # YOURS !!! The id is airspace_receiver_<name>_... where <name> is your
      # receiver's config name, slugified (hyphens -> underscores). Find them in
      # Settings -> Entities (filter "receiver"). Example shows a 1090 + 978 pair
      # named "rx-1090" / "rx-978" -> rx_1090 / rx_978; delete the 978 block if
      # you only run 1090.
      - type: entities
        title: Receivers
        entities:
          - entity: binary_sensor.airspace_receiver_rx_1090_status
            name: 1090 receiver
          - entity: sensor.airspace_receiver_rx_1090_aircraft_count
            name: 1090 aircraft
          - entity: sensor.airspace_receiver_rx_1090_message_rate
            name: 1090 msg/s
          - entity: binary_sensor.airspace_receiver_rx_978_status
            name: 978 receiver
          - entity: sensor.airspace_receiver_rx_978_aircraft_count
            name: 978 aircraft
          - entity: sensor.airspace_receiver_rx_978_message_rate
            name: 978 msg/s

# ---------------------------------------------------------------------------
# Optional: drone OPERATOR on the map.
#
# The nearest-drone sensor already maps the drone itself. The operator's
# location (operator_lat / operator_lon attributes) needs one tiny template
# sensor in configuration.yaml to expose it as latitude/longitude:
#
# template:
#   - sensor:
#       - name: Airspace Drone Operator
#         unique_id: airspace_drone_operator_map
#         state: "{{ state_attr('sensor.airspace_nearest_drone', 'operator_id') or 'operator' }}"
#         attributes:
#           latitude: "{{ state_attr('sensor.airspace_nearest_drone', 'operator_lat') }}"
#           longitude: "{{ state_attr('sensor.airspace_nearest_drone', 'operator_lon') }}"
#           icon: mdi:account-alert
#
# Then add `- entity: sensor.airspace_drone_operator` to the Map card entities.
# ---------------------------------------------------------------------------
