# Example Home Assistant automations for ha-airspace alerts (v0.2.11+).
#
# The service does the detection: each `enrichment.alerts.rules` entry becomes a
# binary_sensor.airspace_alert_<rule> that turns `on` while any aircraft matches
# (ENTER) and `off` when none do (EXIT). It also exposes the triggering aircraft
# on that entity's attributes (json_attributes_topic = airspace/alert/<rule>/info):
#
#   flight, hex, registration, aircraft_type, squawk, alt_baro_ft,
#   distance_to{<watchpoint>}, bearing_to{<watchpoint>}, flags, db_metadata,
#   and (when photos are enabled) entity_picture + photographer.
#
# So "setting up the actual alerts" on the HA side is just: trigger on the
# binary_sensor going on, then notify. No templates required for a basic push;
# the richer examples below pull detail from the attributes.
#
# Paste into Settings -> Automations -> (⋮) Edit in YAML, or add under
# `automation:` in configuration.yaml. Replace:
#   - binary_sensor.airspace_alert_<rule>  -> your rule names
#   - notify.mobile_app_<device>           -> your HA mobile-app notify service
#   - the watchpoint key ("home")          -> your primary watchpoint name
#
# Each automation has a unique `id:` — required for HA to manage it from the UI
# (without it you get "does not have a unique ID"). Keep them unique; never reuse
# an `id` across automations.

# ---------------------------------------------------------------------------
# 1. Minimal — push the moment a rule fires. No templating.
# ---------------------------------------------------------------------------
- id: airspace_military_close_notify
  alias: "Airspace · military close · notify"
  description: "Push when the military_close rule turns on."
  trigger:
    - platform: state
      entity_id: binary_sensor.airspace_alert_military_close
      to: "on"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "🛩️ Military aircraft nearby"
        message: >-
          {{ state_attr('binary_sensor.airspace_alert_military_close', 'flight')
             or state_attr('binary_sensor.airspace_alert_military_close', 'hex') }}

# ---------------------------------------------------------------------------
# 2. Rich — flight, type, distance + altitude in the body; Planespotters photo
#    as the notification image (needs `photos.enabled: true`). Tapping the
#    notification opens the Airspace dashboard view.
# ---------------------------------------------------------------------------
- id: airspace_military_close_rich_notify
  alias: "Airspace · military close · rich notify"
  trigger:
    - platform: state
      entity_id: binary_sensor.airspace_alert_military_close
      to: "on"
  # No automation-level `variables:` — the HA UI editor drops them on save/
  # round-trip. Each template inlines `{% set a = ... %}` instead (robust).
  action:
    - service: notify.mobile_app_phone
      data:
        title: >-
          {% set a = 'binary_sensor.airspace_alert_military_close' -%}
          🚨 {{ state_attr(a, 'flight') or state_attr(a, 'hex') }}{{ ' · ' ~ state_attr(a, 'aircraft_type') if state_attr(a, 'aircraft_type') }}
        message: >-
          {% set a = 'binary_sensor.airspace_alert_military_close' -%}
          {% set d = (state_attr(a, 'distance_to') or {}).get('home') -%}
          {% set b = (state_attr(a, 'bearing_to') or {}).get('home') -%}
          {{ '%.1f nm'|format(d) if d is not none else '? nm' }}
          {{ 'brg %d°'|format(b|round(0)|int) if b is not none else '' }}
          · {{ state_attr(a, 'alt_baro_ft') or '?' }} ft
          {% if state_attr(a, 'squawk') %}· squawk {{ state_attr(a, 'squawk') }}{% endif %}
        data:
          # entity_picture is a relative URL; prefix your HA base_url for mobile.
          image: "{{ state_attr('binary_sensor.airspace_alert_military_close', 'entity_picture') }}"
          # Tap-to-open (Android: clickAction / iOS: url). Point at your view.
          clickAction: "/lovelace/airspace"
          url: "/lovelace/airspace"
          push:
            interruption-level: time-sensitive  # iOS: bypass focus modes

# ---------------------------------------------------------------------------
# 3. Persistent notification (no mobile app) — stays in the HA sidebar until
#    dismissed. Handy for a wall tablet.
# ---------------------------------------------------------------------------
- id: airspace_emergency_squawk_persistent
  alias: "Airspace · emergency squawk · persistent"
  trigger:
    - platform: state
      entity_id: binary_sensor.airspace_alert_emergency
      to: "on"
  action:
    - service: persistent_notification.create
      data:
        notification_id: airspace_emergency
        title: "🚨 Emergency squawk"
        message: >-
          {% set a = 'binary_sensor.airspace_alert_emergency' %}
          {{ state_attr(a, 'flight') or state_attr(a, 'hex') }}
          squawking {{ state_attr(a, 'squawk') }}
  # Optional companion: clear it on EXIT.
- id: airspace_emergency_squawk_clear
  alias: "Airspace · emergency squawk · clear"
  trigger:
    - platform: state
      entity_id: binary_sensor.airspace_alert_emergency
      to: "off"
  action:
    - service: persistent_notification.dismiss
      data:
        notification_id: airspace_emergency

# ---------------------------------------------------------------------------
# 4. Drone in the area — Remote ID, with operator location. The nearest-drone
#    sensor carries ua_type / self_id / agl_ft / operator_lat-lon and (with
#    drone_registry on) make/model in db_metadata.
#
#    Trigger on the nearest-drone sensor's `track_id` attribute changing — NOT
#    on sensor.airspace_drone_count. The count and the nearest-drone sensor are
#    two separate entities: the count includes drones with no position yet
#    (Basic ID heard before a Location message), but the nearest sensor only
#    carries *positioned* drones. Triggering on the count therefore fired the
#    automation while the nearest sensor still held a PREVIOUS (or stale
#    retained) drone — the wrong aircraft, often with "unknown nm". Keying off
#    the nearest sensor's track_id makes the trigger and the message body the
#    same, self-consistent entity, and naturally waits until a positioned drone
#    exists (so distance is always present). Trade-off: this alerts on the
#    nearest drone; a second, FARTHER drone appearing while a nearer one is
#    already tracked won't re-fire. For a "drone near me" alert that's the right
#    scope — switch back to a count trigger if you want every drone.
#
#    If you've also set up #5/#6 (drone_conflict / drone_nearby below), add
#    the second condition line: per-poll, alerts are evaluated BEFORE the
#    summary is published (tracker.tick() runs _evaluate_alerts() then
#    _publish_summary()), so binary_sensor.airspace_alert_drone_conflict/
#    _nearby are already updated in HA by the time this trigger's condition
#    runs on the same tick. For a drone that flies close to your own
#    watchpoint (the common case), its first position fix is often ALREADY
#    inside drone_conflict's/drone_nearby's thresholds — so without this
#    condition, "drone detected" and "drone conflict"/"drone nearby" fire
#    together on every close-in drone, which reads as a duplicate push. The
#    condition below leaves this automation for drones NOT already covered by
#    those — farther out or higher up — while #5/#6 own the close-in case.
# ---------------------------------------------------------------------------
- id: airspace_drone_detected_notify
  alias: "Airspace · drone detected · notify"
  trigger:
    - platform: state
      entity_id: sensor.airspace_nearest_drone
      attribute: track_id
  condition:
    # Ignore the drone clearing (track_id -> None / entity unavailable).
    - "{{ state_attr('sensor.airspace_nearest_drone', 'track_id') is not none
          and states('sensor.airspace_nearest_drone') not in ['unknown', 'unavailable'] }}"
    # Skip if drone_conflict/drone_nearby (below) already covers this drone —
    # avoids a duplicate push for the common close-in case. Remove this line
    # if you haven't set up those rules.
    - "{{ is_state('binary_sensor.airspace_alert_drone_conflict', 'off')
          and is_state('binary_sensor.airspace_alert_drone_nearby', 'off') }}"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "🛸 Drone detected"
        # Identity degrades gracefully: FAA make/model when drone_registry
        # resolves the serial, else the UA type, else "Drone". self_id (the
        # operator's free-text Self-ID broadcast, e.g. "Spoofing test") is
        # UNTRUSTED and only shown as a last-resort label when nothing else
        # identifies the drone — so a resolved DJI never gets tagged with it.
        # Distance comes from the distance_to attribute (rounded, guarded), not
        # states(), so it never renders "unknown nm". operator_location_type:
        # dump3411 flags when operator_lat/lon is actually the drone's own
        # takeoff point, not a live operator fix (some transmitters toggle
        # this across messages) — surface that distinction, don't blanket-
        # label every reading "operator located".
        message: >-
          {% set s = 'sensor.airspace_nearest_drone' %}
          {% set db = state_attr(s, 'db_metadata') or {} %}
          {% set make = db.get('make') %}
          {% set ua = state_attr(s, 'ua_type') %}
          {% set sid = state_attr(s, 'self_id') %}
          {% set nm = (state_attr(s, 'distance_to') or {}).get('home') %}
          {% set loc_type = state_attr(s, 'operator_location_type') %}
          {%- if make %}{{ make }} {{ db.get('model') }}
          {%- elif ua %}{{ ua | capitalize }}
          {%- elif sid %}Drone (self-ID “{{ sid }}”)
          {%- else %}Drone{% endif %}
          {%- if nm is not none %} · {{ nm | round(1) }} nm{% endif %}
          {%- if state_attr(s, 'agl_ft') is not none %} · {{ state_attr(s, 'agl_ft') | round }} ft AGL{% endif %}
          {%- if state_attr(s, 'operator_lat') is not none %} · {{ 'operator takeoff point' if loc_type == 'takeoff' else 'operator located' }}{% endif %}

# ---------------------------------------------------------------------------
# 5. Drone conflict — push when a LOW aircraft is projected to pass within your
#    drone's possible operating area, so you can land before a conflict. This is
#    the replacement for a hand-rolled dump1090 "low traffic" alert.
#
#    TWO parts — the alert rule lives in the ADD-ON config, the push here:
#
#    (a) Add this rule to the add-on's extra_config under enrichment.alerts.rules
#        (that list REPLACES the toggle-generated rules, so keep your others too):
#
#          - name: drone_conflict
#            match:
#              max_closest_approach_nm: 10.8   # ~20 km: optimistic consumer-drone
#                                              #   (DJI O4/O3, FCC) range from home
#              max_alt_agl_ft: 1640            # ~500 m: typical DJI max-altitude ceiling
#              within_eta_s: 600               # only if arriving within 10 min
#                                              #   (omit for earlier/broader warning)
#              watchpoint: home
#
#        max_closest_approach_nm only fires for INBOUND tracks (a departing plane
#        never matches). REQUIRES the home watchpoint to set elevation_m — without
#        it AGL is computed from MSL and the altitude filter silently misses low
#        traffic. Set it in the add-on options:
#          watchpoints:
#            - name: home
#              lat: ...
#              lon: ...
#              elevation_m: 100        # YOUR ground elevation in metres
#
#    (b) This automation fires when the rule turns on. The alert info carries
#        alt_baro_ft, distance/bearing, predicted closest approach + ETA.
#
#    NOTE: drone_conflict's max_closest_approach_nm/within_eta_s require a
#    sustained closing vector (ground_speed_kt + track_deg projecting toward
#    the watchpoint). A hovering or loitering drone — the common case, not a
#    plane on approach — has near-zero speed or no consistent heading, so it
#    never gets a projected ETA and this rule never fires for it, no matter
#    how close/low it actually is. Pair it with drone_nearby (#6 below), a
#    pure-presence rule with no inbound requirement.
# ---------------------------------------------------------------------------
- id: airspace_drone_conflict_notify
  alias: "Airspace · drone conflict · notify"
  trigger:
    - platform: state
      entity_id: binary_sensor.airspace_alert_drone_conflict
      to: "on"
  # No automation-level `variables:` (the HA UI editor drops them on save) —
  # the message inlines `{% set a = ... %}` instead.
  action:
    - service: notify.mobile_app_phone
      data:
        title: "⚠️ Low aircraft inbound — land the drone"
        message: >-
          {% set a = 'binary_sensor.airspace_alert_drone_conflict' -%}
          {{ state_attr(a,'flight') or state_attr(a,'hex') }}{{ ' · ' ~ state_attr(a,'aircraft_type') if state_attr(a,'aircraft_type') }}
          · {{ state_attr(a,'alt_baro_ft') or '?' }} ft
          {% set d = (state_attr(a,'distance_to') or {}).get('home') -%}
          {{ '· ' ~ '%.1f'|format(d) ~ ' nm now' if d is not none }}
          {% set cpa = state_attr(a,'predicted_closest_approach_nm') -%}
          {% set eta = state_attr(a,'predicted_eta_to_home_s') -%}
          {% if cpa is not none %}· within {{ '%.1f'|format(cpa) }} nm{% endif %}{% if eta is not none %} in ~{{ (eta/60)|round(0)|int }} min{% endif %}
        data:
          push:
            interruption-level: time-sensitive   # iOS: bypass focus/silent

# ---------------------------------------------------------------------------
# 6. Drone nearby — push when a drone is close and low RIGHT NOW, regardless of
#    whether it's on a closing vector. Catches the hovering/loitering case
#    drone_conflict's predictive gate misses (see the NOTE on #5).
#
#    (a) Add this rule alongside drone_conflict in the add-on's extra_config:
#
#          - name: drone_nearby
#            match:
#              max_alt_agl_ft: 1640        # ~500 m: typical DJI max-altitude ceiling
#              max_distance_nm: 0.34       # ~630 m: tight — this is presence, not
#                                          #   early warning, so keep it close
#              watchpoint: home
#
#    (b) Message content pulls from sensor.airspace_nearest_drone (ua_type,
#        self_id, agl_ft, operator_lat, db_metadata make/model), NOT from the
#        alert entity's own attributes — the alert `info` topic is generic
#        AircraftPayload-shaped (flight/hex/registration/squawk/...) and
#        carries none of the drone-specific fields. See the code TODO next to
#        `_alert_info` in mqtt/publisher.py for the known gap this creates
#        with multiple simultaneous drones.
# ---------------------------------------------------------------------------
- id: airspace_drone_nearby_notify
  alias: "Airspace · drone nearby · notify"
  trigger:
    - platform: state
      entity_id: binary_sensor.airspace_alert_drone_nearby
      to: "on"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "🛸 Drone nearby"
        # Same identity-degradation + distance/AGL rendering as #4 — pulled
        # from sensor.airspace_nearest_drone, not the alert entity (see NOTE
        # above). Known limitation: if a SECOND, farther drone is what
        # actually tripped this rule, the message still describes the
        # nearest one, not the triggering track.
        message: >-
          {% set s = 'sensor.airspace_nearest_drone' %}
          {% set db = state_attr(s, 'db_metadata') or {} %}
          {% set make = db.get('make') %}
          {% set ua = state_attr(s, 'ua_type') %}
          {% set sid = state_attr(s, 'self_id') %}
          {% set nm = (state_attr(s, 'distance_to') or {}).get('home') %}
          {% set loc_type = state_attr(s, 'operator_location_type') %}
          {%- if make %}{{ make }} {{ db.get('model') }}
          {%- elif ua %}{{ ua | capitalize }}
          {%- elif sid %}Drone (self-ID “{{ sid }}”)
          {%- else %}Drone{% endif %}
          {%- if nm is not none %} · {{ nm | round(1) }} nm{% endif %}
          {%- if state_attr(s, 'agl_ft') is not none %} · {{ state_attr(s, 'agl_ft') | round }} ft AGL{% endif %}
          {%- if state_attr(s, 'operator_lat') is not none %} · {{ 'operator takeoff point' if loc_type == 'takeoff' else 'operator located' }}{% endif %}
        data:
          push:
            interruption-level: time-sensitive   # iOS: bypass focus/silent
