[project]
name = "ha-airspace"
version = "0.0.0.0"
description = "Multi-source ADS-B enrichment service: aircraft.json → MQTT → Home Assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Daniel Smith", email = "danielalansmith@me.com" },
]
keywords = [
  "adsb",
  "dump1090",
  "dump978",
  "dump3411",
  "readsb",
  "home-assistant",
  "mqtt",
  "aircraft",
  "drone",
  "remote-id",
  "adsbexchange",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Home Automation",
  "Topic :: Communications :: Ham Radio",
]

dependencies = [
  "httpx>=0.27",
  "aiomqtt>=2.3",
  "pydantic>=2.8",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
]

[project.scripts]
ha-airspace = "ha_airspace.cli:main"

[project.urls]
Homepage = "https://github.com/ifnull/ha-airspace"
Repository = "https://github.com/ifnull/ha-airspace"
Issues = "https://github.com/ifnull/ha-airspace/issues"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "freezegun>=1.5",
  "testcontainers>=4.8",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_airspace"]

# ---------------------------------------------------------------------------
# Ruff: format + lint. CLAUDE.md is the source of truth for style.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "W",      # pycodestyle warnings
  "I",      # isort
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except (bans `except Exception` and bare `except`)
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
  "PT",     # flake8-pytest-style
  "ASYNC",  # flake8-async
  "RUF",    # ruff-specific rules
  "TID",    # flake8-tidy-imports
  "PL",     # pylint subset
  "TRY",    # tryceratops (exception handling)
]
ignore = [
  "E501",   # line too long — formatter handles this
  "PLR0913", # too many arguments — judgment call, not auto-flagged
  "PLR2004", # magic value — too noisy for a domain with lots of constants
  "TRY003", # long exception messages — fine for our terminal-error-message style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "PLR2004", # magic values are fine in tests
  "S101",    # asserts are the point
  "BLE001",  # tests sometimes catch broadly to assert about errors
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["ha_airspace"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict mode. CLAUDE.md says no Any without a comment.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/ha_airspace", "tests"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest. asyncio auto-mode so we don't decorate every test.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "-m", "not integration",
  "--cov=ha_airspace",
  "--cov-report=term-missing",
  "--strict-markers",
]
markers = [
  "integration: tests that require external services (Mosquitto, real receivers). Run with `uv run pytest -m integration`.",
]

[tool.coverage.run]
source = ["src/ha_airspace"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
