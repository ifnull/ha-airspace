# Per-architecture base image for LOCAL add-on builds (dev / HA local-build).
# Releases ship prebuilt images via config.yaml `image:`, so the Supervisor
# pulls rather than uses this. Each maps to the published service image; the
# add-on Dockerfile layers only the renderer + run shim on top.
build_from:
  aarch64: ghcr.io/ifnull/ha-airspace:latest
  amd64: ghcr.io/ifnull/ha-airspace:latest
labels:
  org.opencontainers.image.source: https://github.com/ifnull/ha-airspace
