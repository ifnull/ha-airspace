# ha-airspace — example configuration
#
# Copy to config.yaml and edit. Run with:
#   ha-airspace --config config.yaml
#
# Strict validation: unknown keys are rejected with a clear error at startup,
# so a typo fails loudly rather than being silently ignored. Only the keys
# shown here are valid in Phase 1 (databases / enrichment / alerts arrive in
# Phase 2). Most keys have sensible defaults and can be omitted — the only
# required sections are `watchpoints`, `mqtt`, and `receivers`.

# --------------------------------------------------------------------------
# service — global runtime knobs (all optional)
# --------------------------------------------------------------------------
service:
  poll_interval_s: 1.0          # default receiver poll cadence; receivers override
  http_timeout_s: 5.0           # per-request HTTP timeout for receiver fetches
  log_level: info               # debug | info | warning | error
  log_destination: stdout       # stdout (JSON, captured by supervisor/journald/Docker)
                                # or file (human-readable; opt-in)

# --------------------------------------------------------------------------
# watchpoints — named locations distance/bearing and "nearest" are measured
# from. At least one is required. "nearest" uses the one named `home` if
# present, otherwise the first in the list.
# --------------------------------------------------------------------------
watchpoints:
  - name: home
    lat: 30.3322
    lon: -97.9853
    elevation_m: 200            # optional; reserved for AGL approximation (Phase 2+)
  # - name: office
  #   lat: 30.4000
  #   lon: -97.7000

# --------------------------------------------------------------------------
# mqtt — broker connection + publish behavior. `broker` is required.
# --------------------------------------------------------------------------
mqtt:
  broker: homeassistant.local   # broker hostname or IP (required)
  port: 1883
  # username: mqtt_user         # omit for anonymous brokers
  # password: mqtt_pass
  base_topic: adsb              # all topics published under adsb/...
  discovery_prefix: homeassistant
  discovery_enabled: true       # publish HA MQTT-discovery entities on connect
  tls: false
  publish_aircraft_min_interval_s: 1.0   # per-hex throttle for adsb/aircraft/<hex>
  publish_summary_min_interval_s: 1.0    # global throttle for adsb/summary/*

# --------------------------------------------------------------------------
# prometheus — optional /metrics endpoint. Off by default; localhost-only
# when enabled (set bind explicitly to expose on the LAN — no auth).
# --------------------------------------------------------------------------
prometheus:
  enabled: false
  bind: 127.0.0.1
  port: 9090

# --------------------------------------------------------------------------
# receivers — one or more aircraft.json sources. At least one is required.
# `band` is required and has no default (1090 | 978).
# --------------------------------------------------------------------------
receivers:
  - name: home-1090
    url: http://piaware.local:8080/skyaware/data/aircraft.json
    band: "1090"
    # poll_interval_s: 1.0      # optional per-receiver override
    # location:                 # optional; auto-detected from receiver.json if absent
    #   lat: 30.3322
    #   lon: -97.9853
    #   alt_m: 200
    # auth:                     # optional; type: none | basic | header
    #   type: basic
    #   username: rx_user
    #   password: rx_pass
    enabled: true

  # A second receiver, e.g. 978 MHz UAT on the same appliance:
  # - name: home-978
  #   url: http://piaware.local:8080/skyaware978/data/aircraft.json
  #   band: "978"

# --------------------------------------------------------------------------
# enrichment — declarative flag rules (Phase 2a). Optional; omit for no flags.
# Each flag sets exactly one matcher:
#   squawks     — exact transponder code
#   patterns    — callsign starts-with (case-insensitive)
#   types       — ICAO type designator (case-insensitive)
#   categories  — ADS-B emitter category (e.g. A7 rotorcraft)
#   sources     — DB-backed (db:field); matches a truthy db_metadata field.
#                 Needs the reference-DB loader (a later Phase 2a slice); until
#                 then these never match.
# Matched flag names appear in adsb/aircraft/<hex> and the summary count_by_flag.
# --------------------------------------------------------------------------
# enrichment:
#   flags:
#     emergency_squawk:
#       squawks: ["7500", "7600", "7700"]
#     mil_callsign:
#       patterns: ["RCH", "SAM", "EVAC", "MEDEVAC", "LIFEGUARD"]
#     heavy_mil:
#       types: ["B52", "C17", "C5M", "U2", "B1", "B2", "RC135"]
#     rotorcraft:
#       categories: ["A7"]
#     # military:                    # DB-backed — inert until the DB loader lands
#     #   sources: ["mictronics:mil", "adsbexchange:mil"]
