# ha-airspace — example configuration
#
# Copy to config.yaml and edit. Run with:
#   ha-airspace --config config.yaml
#
# Strict validation: unknown keys are rejected with a clear error at startup,
# so a typo fails loudly rather than being silently ignored. Only the keys
# shown here are valid in Phase 1 (databases / enrichment / alerts arrive in
# Phase 2). Most keys have sensible defaults and can be omitted — the only
# required sections are `watchpoints`, `mqtt`, and `receivers`.

# --------------------------------------------------------------------------
# service — global runtime knobs (all optional)
# --------------------------------------------------------------------------
service:
  poll_interval_s: 1.0          # default receiver poll cadence; receivers override
  http_timeout_s: 5.0           # per-request HTTP timeout for receiver fetches
  log_level: info               # debug | info | warning | error
  log_destination: stdout       # stdout (JSON, captured by supervisor/journald/Docker)
                                # or file (human-readable; opt-in)

# --------------------------------------------------------------------------
# watchpoints — named locations distance/bearing and "nearest" are measured
# from. At least one is required. "nearest" uses the one named `home` if
# present, otherwise the first in the list.
# --------------------------------------------------------------------------
watchpoints:
  - name: home
    lat: 30.3322
    lon: -97.9853
    elevation_m: 200            # optional; reserved for AGL approximation (Phase 2+)
  # - name: office
  #   lat: 30.4000
  #   lon: -97.7000

# --------------------------------------------------------------------------
# mqtt — broker connection + publish behavior. `broker` is required.
# --------------------------------------------------------------------------
mqtt:
  broker: homeassistant.local   # broker hostname or IP (required)
  port: 1883
  # username: mqtt_user         # omit for anonymous brokers
  # password: mqtt_pass
  base_topic: adsb              # all topics published under adsb/...
  discovery_prefix: homeassistant
  discovery_enabled: true       # publish HA MQTT-discovery entities on connect
  tls: false
  publish_aircraft_min_interval_s: 1.0   # per-hex throttle for adsb/aircraft/<hex>
  publish_summary_min_interval_s: 1.0    # global throttle for adsb/summary/*

# --------------------------------------------------------------------------
# prometheus — optional /metrics endpoint. Off by default; localhost-only
# when enabled (set bind explicitly to expose on the LAN — no auth).
# --------------------------------------------------------------------------
prometheus:
  enabled: false
  bind: 127.0.0.1
  port: 9090

# --------------------------------------------------------------------------
# receivers — one or more aircraft.json sources. At least one is required.
# `band` is required and has no default (1090 | 978).
# --------------------------------------------------------------------------
receivers:
  - name: home-1090
    url: http://piaware.local:8080/skyaware/data/aircraft.json
    band: "1090"
    # poll_interval_s: 1.0      # optional per-receiver override
    # location:                 # optional; auto-detected from receiver.json if absent
    #   lat: 30.3322
    #   lon: -97.9853
    #   alt_m: 200
    # auth:                     # optional; type: none | basic | header
    #   type: basic
    #   username: rx_user
    #   password: rx_pass
    enabled: true

  # A second receiver, e.g. 978 MHz UAT on the same appliance:
  # - name: home-978
  #   url: http://piaware.local:8080/skyaware978/data/aircraft.json
  #   band: "978"

# --------------------------------------------------------------------------
# remoteid — drone Remote ID feeds (dump3411 / ASTM F3411 over BLE + WiFi).
# Optional; omit for ADS-B only. Drones merge into the same airspace view as
# aircraft but get their own HA entities (drone_count, nearest_drone with
# operator location) and adsb/drone/<id> topics. No band/auth — just a URL.
# Names share the receiver namespace and must be unique across both lists.
# --------------------------------------------------------------------------
# remoteid:
#   - name: dump3411
#     url: http://dump3411.local:8754/data/remoteid.json
#     # poll_interval_s: 1.0      # optional override
#     enabled: true

# --------------------------------------------------------------------------
# databases — reference DBs that enrich aircraft (registration, type, model,
# and the military / interesting / PIA / LADD flags the `sources` matcher
# below reads). Optional; omit to run with no DB enrichment. The files are
# downloaded and refreshed in the background (~25 MB gzip'd, ~620k aircraft).
# --------------------------------------------------------------------------
# databases:
#   cache_dir: /data/db
#   refresh_interval_h: 168       # weekly
#   sources:
#     - name: mictronics          # name selects the parser (mictronics | adsbexchange)
#       url: https://github.com/wiedehopf/tar1090-db/raw/csv/aircraft.csv.gz
#       enabled: true
#     - name: adsbexchange
#       url: https://downloads.adsbexchange.com/downloads/basic-ac-db.json.gz
#       enabled: true

# --------------------------------------------------------------------------
# enrichment — flag + alert rules (Phase 2a). Optional; omit for neither.
#
# flags: tag aircraft. Each flag sets exactly one matcher:
#   squawks     — exact transponder code
#   patterns    — callsign starts-with (case-insensitive)
#   types       — ICAO type designator (case-insensitive)
#   categories  — ADS-B emitter category (e.g. A7 rotorcraft)
#   sources     — DB-backed (db:field); matches a truthy db_metadata field.
#                 Requires the `databases` section above; without it these
#                 never match (db_metadata stays empty).
# Matched flag names appear in adsb/aircraft/<hex> and the summary count_by_flag.
#
# alerts: fire when an aircraft starts matching a rule (ENTER) and clear when
# it stops (EXIT). Each rule's `match` combines conditions: different keys are
# AND, a list within one key is OR. ENTER publishes adsb/alert/<rule>/<hex>;
# a per-rule binary_sensor.adsb_alert_<rule> turns on while any aircraft matches.
# Match keys: flags, category, max_distance_nm, max_alt_agl_ft, watchpoint.
# (max_alt_agl_ft needs the watchpoint to have elevation_m; v1 AGL = MSL minus it.)
# --------------------------------------------------------------------------
# enrichment:
#   flags:
#     emergency_squawk:
#       squawks: ["7500", "7600", "7700"]
#     mil_callsign:
#       patterns: ["RCH", "SAM", "EVAC", "MEDEVAC", "LIFEGUARD"]
#     heavy_mil:
#       types: ["B52", "C17", "C5M", "U2", "B1", "B2", "RC135"]
#     rotorcraft:
#       categories: ["A7"]
#     military:                    # DB-backed — needs the `databases` section
#       sources: ["mictronics:mil", "adsbexchange:mil"]
#     privacy:
#       sources: ["adsbexchange:pia", "adsbexchange:ladd"]
#
#   alerts:
#     cooldown_s: 60               # min seconds between EXIT and re-ENTER (same rule+hex)
#     rules:
#       - name: military_close
#         match:
#           flags: ["military"]            # OR within key
#           max_distance_nm: 30            # AND across keys
#           watchpoint: home               # which watchpoint distance is from
#       - name: emergency_anywhere
#         match:
#           flags: ["emergency_squawk"]
#       - name: low_helicopter
#         match:
#           category: ["A7"]               # alert match can read raw fields too
#           max_alt_agl_ft: 2000           # needs home.elevation_m set above
#           max_distance_nm: 10
#           watchpoint: home

# --------------------------------------------------------------------------
# journal — SQLite history (Phase 2b). Optional; OMIT to disable persistence,
# which is the right call on a Raspberry Pi SD card where you want to minimize
# writes. When present, `first_seen` survives restarts (otherwise it resets to
# "now" each time a track reappears). Writes are coalesced (buffered, flushed
# on a timer or threshold) — never per poll. Track summary rows are kept
# forever; event-history rows are pruned after retention_observations_days.
# --------------------------------------------------------------------------
# journal:
#   path: /data/journal.db
#   retention_observations_days: 90
#   write_coalesce_s: 30            # flush at least this often
#   write_coalesce_events: 50       # flush early once this many records buffer
