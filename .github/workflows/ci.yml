# Gate: the same checks as the local pre-commit gate, plus a Docker build smoke.
# Runs on every PR and on pushes to main. No publishing happens here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    name: version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to compare against the last release

      # Catches the "forgot to bump" failure before it becomes a failed release:
      # main must always be ahead of the last tag, and the two version files
      # must agree (the publish workflow's tag==version guard then can't fail).
      - name: pyproject + add-on versions match, and are unreleased
        run: |
          pj="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          ad="$(grep -m1 '^version: ' addon/config.yaml | cut -d'"' -f2)"
          echo "pyproject=$pj  addon=$ad"
          if [ "$pj" != "$ad" ]; then
            echo "::error::version mismatch: pyproject ($pj) != addon/config.yaml ($ad)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$pj" >/dev/null; then
            echo "::error::v$pj is already released (tag exists). Bump the version for unreleased changes."
            exit 1
          fi
          echo "version $pj is consistent and not yet released ✓"

  gate:
    name: lint · type · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync (locked, with dev tools)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests scripts addon

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest (unit; integration deselected by default)
        run: uv run pytest -q

  docker-build:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64-only here (fast): proves the Dockerfile builds and the entrypoint
      # imports. Multi-arch is exercised by the publish workflow.
      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ha-airspace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — entrypoint runs
        run: docker run --rm ha-airspace:ci --version
