# Publish the multi-arch service image to GHCR on a version tag.
#
# Trigger: pushing a tag like v0.1.0. Nothing publishes on ordinary commits —
# a release is an explicit, deliberate `git tag` + `git push --tags`.
#
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no registry secret to
# configure. The image lands at ghcr.io/<owner>/<repo> = ghcr.io/ifnull/ha-airspace,
# which is what addon/build.yaml pins, so a published `latest` unblocks the
# add-on build.
#
# NOTE: the in-app version string (`ha-airspace --version`, service_starting log)
# still reads the pyproject version until dynamic git-tag versioning is wired —
# tracked as a follow-up. The image *tag* is correct; only the embedded string
# lags.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  service-image:
    name: build + push multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: the pushed tag must match the pyproject version, so the image
      # tag and the version baked into the wheel can never silently drift.
      - name: Verify tag matches package version
        run: |
          pkg_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject=${pkg_version} tag=${tag_version}"
          if [ "${pkg_version}" != "${tag_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${pkg_version}"
            exit 1
          fi

      # QEMU enables the arm64 cross-build; buildx drives the multi-platform
      # manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # armv7 is intentionally omitted for now: pydantic-core (Rust) lacks a
      # reliable armv7 wheel, so that arch compiles from source under QEMU —
      # slow and flaky. aarch64 covers all 64-bit HAOS Pis. Add armv7 back once
      # a clean wheel/build path is proven.
      - name: Build + push (amd64 · arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Clean manifest list (no extra attestation entries) so HA's add-on
          # builder resolves the per-arch base image cleanly.
          provenance: false

  # Prebuilt add-on images so the Supervisor pulls (not builds-on-device) the
  # add-on. HA add-ons use per-arch image *names* (aarch64-..., amd64-...), one
  # single-arch image each — not a manifest list — matching config.yaml's
  # image: "ghcr.io/ifnull/{arch}-addon-ha-airspace". Built FROM the service
  # image, so it waits for service-image.
  addon-image:
    name: build + push add-on (${{ matrix.ha_arch }})
    needs: service-image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
          - ha_arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build + push add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.ha_arch }}-addon-ha-airspace:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.ha_arch }}-addon-ha-airspace:latest
          provenance: false
